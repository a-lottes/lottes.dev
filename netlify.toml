[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# ── Language switch on "/" ─────────────────────────────────────────────
# Negotiated server-side from Accept-Language, so visitors and crawlers get a
# real redirect instead of the meta-refresh page. The first matching rule wins.
# force = true is needed because _site/index.html exists; that page stays as
# the fallback if these rules ever go away. Same pattern as aspark.lottes.dev.

[[redirects]]
  from = "/"
  to = "/de/"
  status = 302
  force = true
  conditions = {Language = ["de"]}

[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true
  conditions = {Language = ["fr"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

# ── URLs from the site before the Eleventy relaunch ───────────────────
# Google still crawls these (Search Console, 2026-09-22). Pages with a
# successor redirect permanently; content that no longer exists answers
# 410 Gone, which drops out of the index faster than a plain 404.

[[redirects]]
  from = "/pages/about/"
  to = "/de/about/"
  status = 301

[[redirects]]
  from = "/pages/contacts/"
  to = "/de/contact/"
  status = 301

[[redirects]]
  from = "/tag/*"
  to = "/de/blog/"
  status = 301

[[redirects]]
  from = "/posts/*"
  to = "/404.html"
  status = 410

# Starter-template sample post, removed 2026-09-23.
[[redirects]]
  from = "/en/blog/secondpost/"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/en/blog/tags/number-2/"
  to = "/404.html"
  status = 410
